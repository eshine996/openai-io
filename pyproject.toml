[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openai-io"
description = "轻量级的 OpenAI 大模型 IO 库：chat / completions / embeddings，基于 httpx，langchain 风格 message"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "eshine" }]
keywords = ["openai", "llm", "chat", "embedding", "httpx", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/eshine996/openai-io"
Repository = "https://github.com/eshine996/openai-io"
Issues = "https://github.com/eshine996/openai-io/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_io"]

[tool.hatch.build.targets.sdist]
# uv.lock 属于开发环境产物，不应进入 sdist
exclude = ["uv.lock"]

[tool.hatch.version]
# 版本单一来源：只维护 src/openai_io/__init__.py 中的 __version__
path = "src/openai_io/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = [
    # 中文 docstring 里的全角括号等会被 RUF001/2/3 误报为歧义字符
    "RUF001",
    "RUF002",
    "RUF003",
    # pydantic 模型通过 Field 默认值提供可选参数，无需 ANN401 约束
    "ANN401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
